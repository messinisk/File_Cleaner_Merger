[testenv]
deps =
    pytest
    coverage
    ; commands_pre =
    ; python --version
    ; ls -la pure_core
commands =
    coverage erase
    coverage run --source=core -m pytest
    coverage report
    coverage html

[testenv:lint]
skip_install = true
deps =
    radon 
    bandit 
commands =
    radon cc core
    radon mi core
    radon raw core
    radon hal core
    bandit -r core


