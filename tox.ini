[testenv]
deps =
    ; pytest
    ; coverage
    ; commands_pre =
    ; python --version
    ; ls -la pure_core
commands =
    ; coverage erase
    ; coverage run --source=pure_core -m pytest
    ; coverage report

[testenv:lint]
skip_install = true
deps =
    ; ruff
    radon
    bandit
commands =
    ; ruff format core
    ; radon cc .
    ; radon mi .
    ; radon raw .
    ; radon hal .
    bandit -r core


