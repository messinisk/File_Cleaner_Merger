[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "file_cleaner_merger"
version = "1.0.0"
requires-python = ">=3.9,<3.14"
description = "Καθαριστής και Συγχωνευτής αρχείων - Cross-platform File Cleaner & Merger"
readme = "README.md"
authors = [
    { name="kostas messsinis", email="messinisk35@gmail.com"}
]
license = { text = "MIT" }


# Ο πυρήνας χωρίς επικίνδυνα dependencies
dependencies = [
    # εδώ μπορείς να προσθέσεις αν χρειαστεί π.χ. "pathlib", "shutil" είναι built-in
]

[project.optional-dependencies]
# Mobile/Desktop (Kivy καλύπτει και τα δύο)
gui = ["kivy"]

# Developer tools
dev = ["pytest", "mypy", "ruff", "radon", "coverage", "bandit"]

[tool.hatch.build.targets.wheel]
packages = ["core", "scripts"]

[dependency-groups]
dev = [
    "rope>=1.14.0",
]
