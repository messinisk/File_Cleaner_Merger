name: Multi-OS with Tox

on:
  workflow_call:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        arch: [x64]
        include:
          - os: ubuntu-latest
            arch: arm64
            purpose: mobile
          - os: ubuntu-latest
            arch: x64
            purpose: desktop
          - os: ubuntu-latest
            arch: x64
            purpose: server
          - os: windows-latest
            arch: x64
            purpose: desktop
          - os: windows-latest
            arch: arm64
            purpose: mobile
          - os: windows-latest
            arch: x64
            purpose: server

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: pip install tox

      - name: Run tests with tox
        run: tox
        env:
          TOXENV: py${{ matrix.python-version }}
          CI: true
