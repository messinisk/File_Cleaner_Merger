name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # 🔹 ώστε να μην ακυρώνονται τα υπόλοιπα builds
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip list

      - name: Run tests
        run: |
          pytest -v --maxfail=3 --disable-warnings

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: test   # 🔹 περιμένει πρώτα τα tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build

      - name: Build wheel
        run: |
          python -m build

      - name: Upload build artifact
        uses: actions/upload-artifact@v3   # 🔹 v3 αντί για v4
        with:
          name: dist
          path: dist/*
